<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Hóa Đơn - Galaxy Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#eef0f4;
            --primary:#2563eb; --primary-d:#1d4ed8; --primary-soft:#eaf1ff;
            --green:#16a34a; --teal:#0d9488; --orange:#f97316; --gray:#64748b; --red:#dc2626;
            --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
        }
        *{box-sizing:border-box}
        body{font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            background:radial-gradient(1200px 400px at 50% -100px,#dbe7ff 0%,transparent 70%),var(--bg);
            margin:0;padding:28px 20px;color:var(--text);-webkit-font-smoothing:antialiased}
        .container{max-width:1280px;margin:0 auto}
        .card{background:var(--card);padding:28px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #e9ecf3}

        .header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
            padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
        .brand{display:flex;align-items:center;gap:14px}
        .brand-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;
            background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 6px 16px rgba(79,70,229,.35)}
        h2{margin:0;font-size:21px;font-weight:700;color:#111827;letter-spacing:-.2px}
        .sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
        .btn-group{display:flex;gap:10px;flex-wrap:wrap}

        .btn{display:inline-flex;align-items:center;gap:7px;border:none;padding:10px 16px;border-radius:10px;cursor:pointer;
            font:600 13.5px/1 inherit;font-family:inherit;color:#fff;transition:.18s;white-space:nowrap}
        .btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.14)}
        .btn:active{transform:none}
        .btn-export{background:linear-gradient(135deg,#14b8a6,#0d9488)}
        .btn-reload{background:linear-gradient(135deg,#22c55e,#16a34a)}
        .btn-clear{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px #fecaca}
        .btn-clear:hover{background:#fef2f2}

        .status-box{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;font-weight:500;margin-bottom:20px;font-size:14px;border:1px solid}
        .status-info{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
        .status-success{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
        .status-error{background:#fef2f2;border-color:#fecaca;color:#b91c1c}

        .filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
        .search-wrap{position:relative;flex:1;min-width:260px}
        .search-wrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6;pointer-events:none}
        .search-input{width:100%;padding:12px 16px;border:1.5px solid #e5e7eb;border-radius:10px;outline:none;font-size:14.5px;
            font-family:inherit;background:#fafbfd;color:var(--text);transition:.18s}
        .search-wrap .search-input{padding-left:40px}
        .search-input:hover{border-color:#cbd5e1}
        .search-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
        .date-input{width:170px}

        .table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:68vh}
        table{width:100%;border-collapse:separate;border-spacing:0;background:#fff}
        th,td{padding:13px 16px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
        th{position:sticky;top:0;z-index:2;background:#f8fafc;font-weight:600;color:#475569;font-size:12.5px;
            text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-bottom:1px solid #e5e7eb}
        tbody tr{transition:background .12s}
        tbody tr:nth-child(even){background:#fcfdff}
        tbody tr:hover{background:var(--primary-soft)}
        tbody tr:last-child td{border-bottom:none}
        .nowrap{white-space:nowrap}
        .text-center{text-align:center}
        .text-right{text-align:right}
        .stt{color:var(--muted);font-variant-numeric:tabular-nums}
        .inv-no{font-weight:700;color:#111827;font-variant-numeric:tabular-nums}
        .seller{font-weight:600;color:#1f2937}
        .amount{font-weight:700;color:var(--primary-d);font-variant-numeric:tabular-nums}
        .amount.zero{color:#9ca3af;font-weight:500}
        .badge-tax{display:inline-block;color:var(--primary-d);font-weight:600;background:var(--primary-soft);
            padding:4px 10px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums}

        .actions{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
        .btn-action{border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font:600 12.5px/1 inherit;font-family:inherit;
            transition:.15s;white-space:nowrap;color:#fff}
        .btn-action:hover{filter:brightness(1.08);transform:translateY(-1px)}
        .btn-action:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
        .btn-view{background:var(--primary)}
        .btn-dl{background:var(--orange)}
        .btn-xml{background:var(--gray)}

        .pager{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:18px;font-size:13.5px;color:var(--muted)}
        .pager .btn-action{padding:8px 14px}

        .empty{padding:48px 20px;text-align:center;color:var(--muted)}
        .empty .big{font-size:34px;margin-bottom:6px}

        .modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);
            justify-content:center;align-items:center;padding:16px}
        .modal-content{background:#fff;width:100%;max-width:900px;max-height:92vh;border-radius:16px;padding:28px;overflow-y:auto;
            position:relative;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .18s ease-out}
        @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
        .modal-title{margin:0 0 18px;color:#111827;font-size:18px;font-weight:700;padding-right:40px}
        .close-btn{position:absolute;right:18px;top:18px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
            font-size:22px;cursor:pointer;color:#6b7280;background:#f3f4f6;transition:.15s;line-height:1}
        .close-btn:hover{background:#fee2e2;color:var(--red)}
        .invoice-header-info{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:#f8fafc;padding:18px;border-radius:12px;margin-bottom:18px;border:1px solid var(--line)}
        .invoice-header-info p{margin:6px 0;font-size:14px;line-height:1.5}
        .invoice-header-info b{color:#374151}
        .section-title{margin:18px 0 10px;color:#374151;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
        .modal .table-wrap{max-height:none}
        .total-box{margin-top:18px;margin-left:auto;max-width:460px;background:linear-gradient(135deg,#eff6ff,#eef2ff);
            border:1px solid #dbeafe;padding:16px 18px;border-radius:12px;text-align:right}
        .total-box p{margin:5px 0;font-size:14px}
        .total-box .grand{color:var(--primary-d);font-size:17px;margin-top:10px;padding-top:10px;border-top:1px dashed #bfdbfe}
        .total-box .words{font-style:italic;color:var(--muted);font-size:13px}

        @media(max-width:760px){
            .invoice-header-info{grid-template-columns:1fr}
            .date-input{flex:1;width:auto}
            .card{padding:18px}
        }

        /* ===== bổ sung: tổng hợp, bộ lọc nhanh, sắp xếp, dark mode ===== */
        .filters{margin-bottom:12px}
        .filters2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
        .chip{border:1.5px solid #e5e7eb;background:#fff;color:#374151;padding:7px 13px;border-radius:999px;cursor:pointer;
            font:500 13px/1 inherit;font-family:inherit;transition:.15s;white-space:nowrap}
        .chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
        .chip.reset{color:var(--red)}
        .chip.reset:hover{border-color:#fca5a5;background:#fef2f2;color:var(--red)}
        .sep{width:1px;height:22px;background:#e5e7eb;margin:0 4px}
        .amt{width:150px;padding:8px 12px;font-size:13px}
        .page-size{padding:8px 10px;font-size:13px;width:auto;cursor:pointer}
        .spacer{flex:1}
        .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
        .sum-card{padding:14px 16px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
        .sum-card .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
        .sum-card .val{margin-top:4px;font-size:20px;font-weight:700;color:#111827;font-variant-numeric:tabular-nums}
        .sum-card .val small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
        .sum-card.main{background:linear-gradient(135deg,#eff6ff,#eef2ff);border-color:#dbeafe}
        .sum-card.main .val{color:var(--primary-d)}
        th[data-sort]{cursor:pointer;user-select:none}
        th[data-sort]:hover{color:var(--primary);background:#eef4ff}
        th[data-sort]::after{content:"↕";opacity:.35;margin-left:6px;font-size:11px}
        th[data-dir="1"]::after{content:"▲";opacity:1;color:var(--primary)}
        th[data-dir="-1"]::after{content:"▼";opacity:1;color:var(--primary)}
        .badge-tax.clickable{cursor:pointer;transition:.15s}
        .badge-tax.clickable:hover{background:var(--primary);color:#fff}
        .buyer{color:#334155;font-weight:500}
        .rate{color:#475569;font-variant-numeric:tabular-nums}
        .vat{color:#475569;font-weight:600;font-variant-numeric:tabular-nums}
        .btn-theme{background:#fff;color:#374151;box-shadow:inset 0 0 0 1.5px #e5e7eb;padding:10px 13px}
        .btn-theme:hover{background:#f3f4f6}
        @media(max-width:980px){.summary{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:760px){
            .hm{display:none}
            .amt{flex:1;width:auto}
            .sep{display:none}
            .sum-card .val{font-size:16px}
        }

        html[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--line:#2b3a52;
            --primary:#60a5fa;--primary-d:#93c5fd;--primary-soft:#1e3a5f;color-scheme:dark}
        html[data-theme="dark"] body{background:radial-gradient(1200px 400px at 50% -100px,#1e3a8a55 0%,transparent 70%),var(--bg)}
        html[data-theme="dark"] .card{border-color:#2b3a52}
        html[data-theme="dark"] h2,html[data-theme="dark"] .modal-title,html[data-theme="dark"] .sum-card .val{color:#f1f5f9}
        html[data-theme="dark"] .search-input{background:#0f172a;border-color:#334155;color:var(--text)}
        html[data-theme="dark"] .search-input:focus{background:#0f172a}
        html[data-theme="dark"] .chip,html[data-theme="dark"] .btn-theme,html[data-theme="dark"] .btn-clear{background:#1e293b;border-color:#334155;color:#cbd5e1}
        html[data-theme="dark"] .btn-theme{box-shadow:inset 0 0 0 1.5px #334155}
        html[data-theme="dark"] .btn-clear{color:#fca5a5;box-shadow:inset 0 0 0 1.5px #7f1d1d}
        html[data-theme="dark"] .chip:hover,html[data-theme="dark"] .btn-theme:hover{background:var(--primary-soft)}
        html[data-theme="dark"] .sep{background:#334155}
        html[data-theme="dark"] .sum-card{background:#0f172a;border-color:#2b3a52}
        html[data-theme="dark"] .sum-card.main{background:linear-gradient(135deg,#1e3a5f,#312e81);border-color:#3b5b8f}
        html[data-theme="dark"] table{background:#1e293b}
        html[data-theme="dark"] th{background:#17223a;color:#cbd5e1;border-bottom-color:#2b3a52}
        html[data-theme="dark"] th[data-sort]:hover{background:#1e3a5f}
        html[data-theme="dark"] tbody tr:nth-child(even){background:#1a2538}
        html[data-theme="dark"] tbody tr:hover{background:#243b5e}
        html[data-theme="dark"] .inv-no,html[data-theme="dark"] .seller{color:#f1f5f9}
        html[data-theme="dark"] .buyer,html[data-theme="dark"] .rate,html[data-theme="dark"] .vat{color:#cbd5e1}
        html[data-theme="dark"] .table-wrap{border-color:#2b3a52}
        html[data-theme="dark"] .status-info{background:#172554;border-color:#1e40af;color:#bfdbfe}
        html[data-theme="dark"] .status-success{background:#052e16;border-color:#166534;color:#bbf7d0}
        html[data-theme="dark"] .status-error{background:#450a0a;border-color:#991b1b;color:#fecaca}
        html[data-theme="dark"] .modal-content{background:#1e293b;color:var(--text)}
        html[data-theme="dark"] .invoice-header-info{background:#17223a;border-color:#2b3a52}
        html[data-theme="dark"] .invoice-header-info b,html[data-theme="dark"] .section-title{color:#cbd5e1}
        html[data-theme="dark"] .total-box{background:linear-gradient(135deg,#1e3a5f,#312e81);border-color:#3b5b8f}
        html[data-theme="dark"] .close-btn{background:#334155;color:#cbd5e1}
        html[data-theme="dark"] .pager{color:var(--muted)}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <div class="brand">
                <div class="brand-icon">🧾</div>
                <div>
                    <h2>Tra Cứu Hóa Đơn Nội Bộ</h2>
                    <p class="sub">Galaxy Studio · Hóa đơn điện tử đầu vào</p>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-export" onclick="exportToExcel()">📊 Xuất Excel Tổng</button>
                <button class="btn btn-reload" onclick="loadInvoicesFromGitHub()">🔄 Cập Nhật Dữ Liệu Mới</button>
                <button class="btn btn-clear" onclick="clearCache()">🗑️ Xóa Cache</button>
                <button class="btn btn-theme" id="themeBtn" onclick="toggleTheme()" title="Chế độ sáng/tối">🌙</button>
            </div>
        </div>

        <div id="statusBox" class="status-box status-info">
            ⏳ Đang kết nối kho dữ liệu GitHub...
        </div>

        <div class="filters">
            <div class="search-wrap">
                <span class="ico">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Tìm theo MST, tên bên bán/bên mua, số hóa đơn, tên hàng hóa... (không cần gõ dấu)" oninput="debounceFilter()">
            </div>
            <input type="date" id="dateFrom" class="search-input date-input" onchange="filterTable()" title="Từ ngày">
            <input type="date" id="dateTo" class="search-input date-input" onchange="filterTable()" title="Đến ngày">
        </div>

        <div class="filters2">
            <button class="chip" onclick="quickRange('month')">Tháng này</button>
            <button class="chip" onclick="quickRange('lastmonth')">Tháng trước</button>
            <button class="chip" onclick="quickRange('quarter')">Quý này</button>
            <button class="chip" onclick="quickRange('lastquarter')">Quý trước</button>
            <button class="chip" onclick="quickRange('year')">Năm nay</button>
            <span class="sep"></span>
            <input type="number" id="amtMin" class="search-input amt" min="0" placeholder="Tiền từ (VNĐ)" oninput="debounceFilter()">
            <input type="number" id="amtMax" class="search-input amt" min="0" placeholder="Tiền đến (VNĐ)" oninput="debounceFilter()">
            <span class="spacer"></span>
            <select id="pageSize" class="search-input page-size" onchange="changePageSize()" title="Số dòng mỗi trang">
                <option value="50">50 dòng/trang</option><option value="100">100 dòng/trang</option>
                <option value="200">200 dòng/trang</option><option value="500">500 dòng/trang</option>
            </select>
            <button class="chip reset" onclick="clearFilters()">✖ Xóa bộ lọc</button>
        </div>

        <div class="summary" id="summary"></div>

        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;" class="text-center">STT</th>
                    <th style="width: 120px;" data-sort="date">Ngày Lập</th>
                    <th style="width: 180px;" data-sort="number">Số Hóa Đơn</th>
                    <th style="width: 140px;" data-sort="tax">MST Bán</th>
                    <th data-sort="seller">Đơn Vị Bán</th>
                    <th style="width: 170px;" data-sort="buyer">Người Mua Hàng</th>
                    <th style="width: 90px;" class="text-center hm" data-sort="rate">Thuế suất</th>
                    <th style="width: 120px;" class="text-right hm" data-sort="vat">Tiền thuế</th>
                    <th style="width: 140px;" class="text-right" data-sort="total">Tổng tiền (VNĐ)</th>
                    <th style="width: 230px;" class="text-center">Thao Tác</th>
                </tr>
            </thead>
            <tbody id="invoiceList">
                <tr><td colspan="10"><div class="empty"><div class="big">⏳</div>Đang tải danh sách...</div></td></tr>
            </tbody>
        </table>
        </div>
        <div id="pager" class="pager"></div>
    </div>
</div>

<div id="viewModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 class="modal-title">🧾 Chi tiết hóa đơn điện tử</h3>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const repoName = pathSegments.length > 0 ? pathSegments[0] : '';
    const ownerName = window.location.hostname.split('.')[0];
    let allInvoices = [];      // toàn bộ hóa đơn (đã gộp từ cache)
    let currentList = [];      // danh sách đang hiển thị (sau lọc)
    let page = 0;
    let PAGE_SIZE = 100;
    const CACHE_VERSION = 1;   // tăng số này nếu sửa cách đọc XML để buộc đọc lại
    const CONCURRENCY = 8;

    // ---------- IndexedDB cache: mỗi file DATA lưu 1 bản ghi {path, sha, v, invoices} ----------
    function openDB() {
        return new Promise((res, rej) => {
            const r = indexedDB.open("invoiceCache", 1);
            r.onupgradeneeded = () => r.result.createObjectStore("files", { keyPath: "path" });
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
        });
    }
    const dbReq = (db, mode, fn) => new Promise((res, rej) => {
        const st = db.transaction("files", mode).objectStore("files");
        const rq = fn(st); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
    const dbAll = (db) => dbReq(db, "readonly", st => st.getAll());
    const dbPut = (db, rec) => dbReq(db, "readwrite", st => st.put(rec));
    const dbDel = (db, path) => dbReq(db, "readwrite", st => st.delete(path));

    async function clearCache() {
        if (!confirm("Xóa bộ nhớ đệm? Lần sau trang sẽ tải lại toàn bộ file.")) return;
        try { const db = await openDB(); await dbReq(db, "readwrite", st => st.clear()); } catch (e) {}
        allInvoices = []; renderTable([]);
        loadInvoicesFromGitHub();
    }

    window.addEventListener('DOMContentLoaded', () => { loadInvoicesFromGitHub(); });

    function rebuild(cached) {
        const seen = new Set(), out = [];
        cached.forEach(rec => rec.invoices.forEach(inv => {
            const k = `${inv.sellerTax}|${inv.series}|${inv.number}`;
            if (!seen.has(k)) { seen.add(k); out.push(inv); }
        }));
        allInvoices = out;
        filterTable(true);
    }

    async function fetchAndParse(f) {
        const url = encodeURI(f.path); // cùng domain GitHub Pages: nhanh, không bị giới hạn API
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        const list = [];
        if (/\.xml$/i.test(f.path)) {
            const inv = parseXml(await res.text(), f.path, null);
            if (inv) list.push(inv);
        } else {
            const zip = await JSZip.loadAsync(await res.blob());
            for (const name in zip.files) {
                if (!/\.xml$/i.test(name)) continue;
                const inv = parseXml(await zip.files[name].async("string"), f.path, name);
                if (inv) list.push(inv);
            }
        }
        return list;
    }

    async function loadInvoicesFromGitHub() {
        if (!ownerName || !repoName) {
            setStatus("error", "⚠️ Hãy chạy trang web trên đường dẫn GitHub Pages.");
            return;
        }
        let db = null;
        const cached = new Map();
        try {
            db = await openDB();
            (await dbAll(db)).forEach(r => { if (r.v === CACHE_VERSION) cached.set(r.path, r); });
        } catch (e) {}
        if (cached.size) { rebuild(cached); setStatus("info", `⚡ Đã nạp ${allInvoices.length} hóa đơn từ bộ nhớ đệm, đang kiểm tra file mới...`); }
        else setStatus("info", "⏳ Đang quét danh sách file trong thư mục DATA...");

        try {
            // 1 request duy nhất lấy toàn bộ cây thư mục (kể cả thư mục con, >1000 file)
            const res = await fetch(`https://api.github.com/repos/${ownerName}/${repoName}/git/trees/HEAD?recursive=1`);
            if (!res.ok) throw new Error(res.status === 403 ? "GitHub giới hạn tốc độ, thử lại sau" : "mã lỗi " + res.status);
            const tree = await res.json();
            const files = tree.tree.filter(t => t.type === "blob" && t.path.startsWith("DATA/") && /\.(xml|zip)$/i.test(t.path));
            if (!files.length) { setStatus("info", "📁 Thư mục DATA hiện chưa có file hóa đơn XML/ZIP nào."); rebuild(new Map()); return; }

            const live = new Set(files.map(f => f.path));
            for (const p of [...cached.keys()]) if (!live.has(p)) { cached.delete(p); if (db) dbDel(db, p).catch(() => {}); }

            const todo = files.filter(f => !cached.has(f.path) || cached.get(f.path).sha !== f.sha);
            const total = todo.length;
            let done = 0, failed = 0;
            if (total === 0) { rebuild(cached); setStatus("success", `✅ ${allInvoices.length} hóa đơn (không có file mới).`); return; }

            const worker = async () => {
                while (todo.length) {
                    const f = todo.shift();
                    try {
                        const rec = { path: f.path, sha: f.sha, v: CACHE_VERSION, invoices: await fetchAndParse(f) };
                        cached.set(f.path, rec);
                        if (db) dbPut(db, rec).catch(() => {});
                    } catch (e) { failed++; }
                    done++;
                    if (done % 25 === 0 || done === total) {
                        rebuild(cached);
                        setStatus("info", `⏳ Đang tải file mới ${done}/${total}... (${allInvoices.length} hóa đơn)`);
                    }
                }
            };
            await Promise.all(Array.from({ length: CONCURRENCY }, worker));
            rebuild(cached);
            setStatus(failed ? "error" : "success",
                `✅ ${allInvoices.length} hóa đơn (mới tải ${total - failed} file)` + (failed ? ` — ⚠️ ${failed} file lỗi, bấm "Cập Nhật" để thử lại` : "") +
                (tree.truncated ? " — ⚠️ danh sách file quá lớn, GitHub cắt bớt" : ""));
        } catch (err) {
            setStatus(cached.size ? "success" : "error", cached.size
                ? `⚠️ Không kết nối được GitHub (${err.message}), đang dùng ${allInvoices.length} hóa đơn trong bộ nhớ đệm.`
                : "❌ Lỗi kết nối: " + err.message);
        }
    }

    function parseXml(xmlText, path, entry) {
        try {
            const xml = new DOMParser().parseFromString(xmlText, "text/xml");
            // Nhận nhiều selector, trả về giá trị đầu tiên không rỗng
            const getTxt = (...tags) => {
                for (const t of tags) {
                    const el = xml.querySelector(t);
                    if (el && el.textContent.trim()) return el.textContent.trim();
                }
                return "";
            };
            const d10 = (s) => (s || "").substring(0, 10);

            const sellerTax = getTxt("NBan > MST", "MSTNBan", "SellerTaxCode");
            const number = getTxt("SHDon", "SOHDON", "InvoiceNumber");
            if (!sellerTax || !number) return;

            const invoiceSeries = getTxt("KHHDon", "KH", "InvoiceSeries");
            const templateCode = getTxt("KHMSHDon") || (invoiceSeries ? "1" : "");


            const invoiceDate = d10(getTxt("NLap", "NGAY", "InvoiceDate"));
            const signDate = d10(getTxt("DSCKS > NBan SigningTime", "SigningTime", "NgayKy")) || invoiceDate;

            // Hóa đơn liên quan (thay thế / điều chỉnh)
            const relCode = getTxt("TTHDLQuan > TCHDon", "TCHDon");
            const hasMCCQT = !!getTxt("MCCQT");

            const q = (n, s) => { const e = n.querySelector(s); return e ? e.textContent.trim() : ""; };
            const items = [];
            xml.querySelectorAll("HHDVu, HHDang").forEach(node => {
                const name = q(node, "THHDVu, TTen");
                if (!name) return;
                items.push({
                    tc: q(node, "TChat") || "1",
                    name: name,
                    code: q(node, "MHHDVu, MS"),
                    unit: q(node, "DVTinh, DVT"),
                    qty: q(node, "SLuong, SL"),
                    price: q(node, "DGia, DG"),
                    discount: q(node, "STCKhau, STCKhai, CK"),
                    amount: q(node, "ThTien, TT"),
                    vat: q(node, "TSuat"),
                    vatAmt: q(node, "TThue")
                });
            });

            return {
                path: path, entry: entry,
                invoiceType: getTxt("THDon") || "HÓA ĐƠN GIÁ TRỊ GIA TĂNG",
                templateCode: templateCode,
                series: invoiceSeries,
                number: number,
                date: invoiceDate,
                signDate: signDate,
                sellerName: getTxt("NBan > Ten", "NBan > DVTen", "SellerName"),
                sellerTax: sellerTax,
                sellerAddr: getTxt("NBan > DChi"),
                buyerName: getTxt("NMua > Ten", "NMua > DVTen", "BuyerName"),
                buyerTax: getTxt("NMua > MST"),
                buyerAddr: getTxt("NMua > DChi"),
                buyerContact: getTxt("NMua > HVTNMHang", "NMua > HTTThan", "NMua > TNCongTrinh"),
                totalBeforeTax: getTxt("TgTCThue") || "0",
                vatAmount: getTxt("TgTThue") || "0",
                totalAmount: getTxt("TgTTTBSo", "TgTTien", "TONGTIEN", "TotalAmount") || "0",
                totalText: getTxt("TgTTTBChu"),
                status: relCode === "1" ? "Hóa đơn thay thế" : relCode === "2" ? "Hóa đơn điều chỉnh" : "Hóa đơn mới",
                checkResult: hasMCCQT ? "Đã cấp mã hóa đơn" : "Cục Thuế đã nhận không mã",
                relType: relCode === "1" ? "Thay thế" : relCode === "2" ? "Điều chỉnh" : "",
                relNumber: getTxt("TTHDLQuan > SHDCLQuan", "SHDCLQuan"),
                relSeries: getTxt("TTHDLQuan > KHHDCLQuan", "KHHDCLQuan"),
                relDate: d10(getTxt("TTHDLQuan > NLHDCLQuan", "NLHDCLQuan")),
                relNote: getTxt("TTHDLQuan > GChu", "GChu"),
                items: items
            };
        } catch(e) {}
    }

    const A4_COMPACT_CSS = `.main-page{font-size:10pt!important;line-height:1.25!important;padding:10px 14px 8px!important;background-size:150%!important;box-shadow:none!important}

    // Hóa đơn nào HTML không in khung chữ ký thì dựng khung từ chữ ký số trong XML (DSCKS)
    function injectSignatures(doc, xmlText) {
        if (!xmlText || doc.querySelector(".sign-box")) return;
        const x = new DOMParser().parseFromString(xmlText, "text/xml");
        const info = (party) => {
            const sg = x.querySelector("DSCKS > " + party + " Signature") || x.querySelector(party + " > Signature");
            if (!sg) return null;
            const subj = (sg.querySelector("X509SubjectName") || {}).textContent || "";
            const cn = (subj.match(/CN=([^,]+)/) || [])[1] || subj;
            const time = (sg.querySelector("SigningTime") || {}).textContent || "";
            return (cn || time) ? { cn: cn.trim(), time: time.trim() } : null;
        };
        const boxes = doc.querySelectorAll(".sign-dx h3");
        [["NMua", 0], ["NBan", 1]].forEach(([party, i]) => {
            const h3 = boxes[i], d = info(party);
            if (!h3 || !d) return;
            const holder = h3.querySelector("td") || h3;
            const box = doc.createElement("div");
            box.className = "sign-box";
            box.innerHTML = `<span style="display:block">Đã ký số</span><span class="span-sign-box" style="display:block">Ký bởi: ${esc(d.cn)}</span><span class="span-sign-box" style="display:block">Ký ngày: ${esc(d.time)}</span>`;
            holder.appendChild(box);
        });
    }

    // Ép gọn để vừa đúng 1 trang A4 (nếu hóa đơn quá dài thì để nhiều trang, không thu nhỏ quá mức)
    function fitToA4(doc) {
        const base = `*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
            html,body{margin:0!important;padding:0!important;background:#fff!important;width:100%!important;height:auto!important;overflow:hidden!important}
            @page{size:A4;margin:0}
            .main-page{width:198mm!important;max-width:198mm!important;margin:6mm auto 0!important}`;
        const st = doc.createElement("style");
        st.textContent = base + A4_COMPACT_CSS;
        doc.head.appendChild(st);
        const el = doc.querySelector(".main-page") || doc.body;
        const H = el.getBoundingClientRect().height;
        const avail = 285 * 96 / 25.4;               // 297mm - 2 * 6mm lề
        let k = Math.min(1, avail / H * 0.96);   // chừa dư để không tràn sang trang trắng
        if (k < 0.6) {                               // quá dài: chia nhiều trang, giữ cỡ chữ
            st.textContent += `@page{margin:6mm}.main-page{margin:0 auto!important}tr{page-break-inside:avoid}`;
            return 1;
        }
        if (k < 1) el.style.zoom = k;
        return k;
    }

    async function renderOriginalPdf(inv) {
        if (!inv.entry) return false;
        const res = await fetch(encodeURI(inv.path));
        if (!res.ok) return false;
        const zip = await JSZip.loadAsync(await res.blob());
        const dir = inv.entry.includes("/") ? inv.entry.slice(0, inv.entry.lastIndexOf("/") + 1) : "";
        const file = (n) => zip.file(dir + n) || zip.file(n);
        const htmlFile = file("invoice.html");
        if (!htmlFile) return false;
        let html = await htmlFile.async("string");

        // nhúng ảnh nền / dấu kiểm tra chữ ký dạng data URI
        for (const n of ["viewinvoice-bg.jpg", "sign-check.jpg"]) {
            const f = file(n);
            if (!f) continue;
            const uri = "data:image/jpeg;base64," + await f.async("base64");
            html = html.replace(new RegExp("url\\((['\"]?)" + n.replace(/[.-]/g, "\\$&") + "\\1\\)", "g"), () => `url("${uri}")`);
        }
        // nhúng details.js (dựng QR)
        const jsFile = file("details.js");
        const js = jsFile ? (await jsFile.async("string")).replace(/<\/script/gi, "<\\/script") : "";
        html = html.replace(/<script[^>]*src=["']details\.js["'][^>]*>\s*<\/script>/i, () => "<script>" + js + "<\/script>");
        const xmlFile = file("invoice.xml") || zip.file(inv.entry);
        const xmlText = xmlFile ? await xmlFile.async("string") : "";

        const frame = document.createElement("iframe");
        frame.style.cssText = "position:fixed;left:0;top:0;width:794px;height:1123px;border:0;opacity:0;pointer-events:none;z-index:-1;";
        document.body.appendChild(frame);
        const oldTitle = document.title;
        try {
            await new Promise((ok, fail) => { frame.onload = ok; frame.onerror = fail; frame.srcdoc = html; });
            const doc = frame.contentDocument, win = frame.contentWindow;
            // chờ details.js dựng xong mã QR (tối đa 3s)
            const qrIn = doc.getElementById("qrcodeContent");
            for (let t = 0; t < 30; t++) {
                const box = doc.getElementById("qrcodeTable");
                if (!qrIn || !qrIn.value || (box && box.children.length)) break;
                await new Promise(r => setTimeout(r, 100));
            }
            injectSignatures(doc, xmlText);
            fitToA4(doc);
            await Promise.all(Array.from(doc.images).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
            await new Promise(r => setTimeout(r, 300));

            // tên file gợi ý trong hộp thoại "Lưu dưới dạng PDF"
            const name = `HoaDon_${inv.series}-${inv.number}_${inv.sellerTax}`;
            document.title = name; doc.title = name;
            await new Promise(done => {
                win.addEventListener("afterprint", done, { once: true });
                setTimeout(done, 180000);
                win.focus();
                win.print();
            });
            return true;
        } finally { document.title = oldTitle; frame.remove(); }
    }

    function downloadPdfFallback(inv) {
        const wrap = document.createElement("div");
        wrap.style.cssText = "position:fixed;left:-10000px;top:0;width:794px;background:#fff;";
        wrap.innerHTML = pdfHtml(inv);
        document.body.appendChild(wrap);
        html2pdf().set({
            margin: 8,
            filename: `HoaDon_${inv.series}-${inv.number}_${inv.sellerTax}.pdf`,
            image: { type: "jpeg", quality: 0.95 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
        }).from(wrap.firstElementChild).save().catch(e => alert("Lỗi tạo PDF: " + e.message)).finally(() => wrap.remove());
    }

    async function downloadPdf(index) {
        const inv = currentList[index];
        const btn = event && event.target && event.target.closest("button");
        const old = btn ? btn.innerHTML : "";
        if (btn) { btn.disabled = true; btn.innerHTML = "⏳ Đang tạo..."; }
        try {
            if (!(await renderOriginalPdf(inv))) downloadPdfFallback(inv);
        } catch (e) {
            console.warn("Không dùng được invoice.html, chuyển sang bản tự dựng:", e);
            downloadPdfFallback(inv);
        } finally {
            if (btn) { btn.disabled = false; btn.innerHTML = old; }
        }
    }

    async function downloadXml(index) {
        const inv = currentList[index];
        try {
            const res = await fetch(encodeURI(inv.path));
            if (!res.ok) throw new Error(res.status);
            let content;
            if (inv.entry) content = await (await JSZip.loadAsync(await res.blob())).files[inv.entry].async("string");
            else content = await res.text();
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([content], { type: "text/xml" }));
            a.download = `${inv.sellerTax}_${inv.number}.xml`;
            a.click();
        } catch (e) { alert("Không tải được file gốc: " + e.message); }
    }

    // ---------- tìm kiếm không dấu, sắp xếp, tổng hợp, lọc nhanh ----------
    const norm = (v) => String(v == null ? "" : v).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
    const money = (v) => Number(v || 0).toLocaleString("vi-VN");
    function invRate(inv) {
        const set = [];
        (inv.items || []).forEach(it => { if (it.vat && !set.includes(it.vat)) set.push(it.vat); });
        return set.join(" / ");
    }
    const rateNum = (inv) => parseFloat(invRate(inv)) || 0;
    function searchText(inv) {
        if (!inv._s) inv._s = norm([inv.sellerTax, inv.sellerName, inv.series, inv.number, (inv.series || "") + "-" + inv.number, (inv.series || "") + inv.number,
            inv.buyerName, inv.buyerTax, inv.buyerContact].concat((inv.items || []).map(i => (i.name || "") + " " + (i.code || ""))).join(" "));
        return inv._s;
    }

    let sortKey = "date", sortDir = -1;
    const SORTERS = {
        date:   (a, b) => (a.date || "").localeCompare(b.date || ""),
        number: (a, b) => (a.series || "").localeCompare(b.series || "") || ((Number(a.number) - Number(b.number)) || String(a.number).localeCompare(String(b.number))),
        tax:    (a, b) => String(a.sellerTax).localeCompare(String(b.sellerTax)),
        buyer:  (a, b) => String(a.buyerContact || a.buyerName || "").localeCompare(String(b.buyerContact || b.buyerName || ""), "vi"),
        seller: (a, b) => String(a.sellerName).localeCompare(String(b.sellerName), "vi"),
        rate:   (a, b) => rateNum(a) - rateNum(b),
        vat:    (a, b) => (Number(a.vatAmount) || 0) - (Number(b.vatAmount) || 0),
        total:  (a, b) => (Number(a.totalAmount) || 0) - (Number(b.totalAmount) || 0)
    };
    function sortBy(k) {
        if (sortKey === k) sortDir = -sortDir;
        else { sortKey = k; sortDir = (k === "date" || k === "total" || k === "vat") ? -1 : 1; }
        filterTable();
    }
    function updateSortIcons() {
        document.querySelectorAll("th[data-sort]").forEach(th => th.dataset.dir = th.dataset.sort === sortKey ? sortDir : "");
    }
    document.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => sortBy(th.dataset.sort)));

    function updateSummary(list) {
        let pre = 0, vat = 0, tot = 0;
        list.forEach(i => { pre += Number(i.totalBeforeTax) || 0; vat += Number(i.vatAmount) || 0; tot += Number(i.totalAmount) || 0; });
        document.getElementById("summary").innerHTML =
            `<div class="sum-card"><div class="lbl">Số hóa đơn</div><div class="val">${list.length.toLocaleString("vi-VN")}</div></div>
             <div class="sum-card"><div class="lbl">Tiền chưa thuế</div><div class="val">${money(pre)}<small>đ</small></div></div>
             <div class="sum-card"><div class="lbl">Tiền thuế GTGT</div><div class="val">${money(vat)}<small>đ</small></div></div>
             <div class="sum-card main"><div class="lbl">Tổng thanh toán</div><div class="val">${money(tot)}<small>đ</small></div></div>`;
    }

    const pad2 = (n) => String(n).padStart(2, "0");
    const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    function quickRange(t) {
        const n = new Date(), y = n.getFullYear(), m = n.getMonth(), q = Math.floor(m / 3) * 3;
        const R = {
            month: [new Date(y, m, 1), new Date(y, m + 1, 0)],
            lastmonth: [new Date(y, m - 1, 1), new Date(y, m, 0)],
            quarter: [new Date(y, q, 1), new Date(y, q + 3, 0)],
            lastquarter: [new Date(y, q - 3, 1), new Date(y, q, 0)],
            year: [new Date(y, 0, 1), new Date(y, 11, 31)]
        }[t];
        document.getElementById("dateFrom").value = ymd(R[0]);
        document.getElementById("dateTo").value = ymd(R[1]);
        filterTable();
    }
    function clearFilters() {
        ["searchInput", "dateFrom", "dateTo", "amtMin", "amtMax"].forEach(id => document.getElementById(id).value = "");
        filterTable();
    }
    function searchBy(v) {
        document.getElementById("searchInput").value = v;
        filterTable();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function changePageSize() {
        PAGE_SIZE = Number(document.getElementById("pageSize").value) || 100;
        try { localStorage.setItem("pageSize", PAGE_SIZE); } catch (e) {}
        renderTable(currentList);
    }
    function toggleTheme() {
        const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        try { localStorage.setItem("theme", t); } catch (e) {}
        syncThemeBtn();
    }
    function syncThemeBtn() { document.getElementById("themeBtn").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙"; }
    (function initUi() {
        try { const ps = Number(localStorage.getItem("pageSize")); if (ps) { PAGE_SIZE = ps; document.getElementById("pageSize").value = ps; } } catch (e) {}
        if (document.getElementById("pageSize").value != PAGE_SIZE) document.getElementById("pageSize").value = "100";
        syncThemeBtn();
    })();

    let filterTimer;
    function debounceFilter() { clearTimeout(filterTimer); filterTimer = setTimeout(() => filterTable(), 250); }
    function filterTable(keepPage) {
        const toks = norm(document.getElementById("searchInput").value).split(/\s+/).filter(Boolean);
        const from = document.getElementById("dateFrom").value, to = document.getElementById("dateTo").value;
        const minV = document.getElementById("amtMin").value, maxV = document.getElementById("amtMax").value;
        const min = minV === "" ? null : Number(minV), max = maxV === "" ? null : Number(maxV);
        const filtered = allInvoices.filter(inv => {
            if (from && inv.date < from) return false;
            if (to && inv.date > to) return false;
            const amt = Number(inv.totalAmount) || 0;
            if (min !== null && amt < min) return false;
            if (max !== null && amt > max) return false;
            if (toks.length) { const t = searchText(inv); if (!toks.every(k => t.includes(k))) return false; }
            return true;
        });
        const cmp = SORTERS[sortKey] || SORTERS.date;
        filtered.sort((a, b) => cmp(a, b) * sortDir || (b.date || "").localeCompare(a.date || "") || String(b.number).localeCompare(String(a.number)));
        renderTable(filtered, keepPage === true);
    }

    function setStatus(type, msg) {
        const el = document.getElementById("statusBox");
        el.className = `status-box status-${type}`;
        el.innerHTML = msg;
    }

    // ================= XUẤT EXCEL: đúng form 35 cột (A:AI), 2 sheet =================
    function exportToExcel() {
        if (!currentList || currentList.length === 0) {
            alert("Chưa có dữ liệu hóa đơn để xuất Excel!");
            return;
        }

        const num = (v) => (v === "" || v == null || isNaN(Number(v))) ? null : Number(v);
        const txt = (v) => (v === "" || v == null) ? null : v;
        const fmtDate = (d) => d ? d.split("-").reverse().join("/") : "...";

        const dates = currentList.map(i => i.date).filter(Boolean).sort();
        const rangeText = `Từ ngày ${fmtDate(dates[0])} đến ${fmtDate(dates[dates.length - 1])}`;

        const HEADER_GROUP = ["THÔNG TIN HÓA ĐƠN","","","","","","THÔNG TIN BÊN BÁN","","","THÔNG TIN BÊN MUA","","","",
            "HÀNG HÓA / DỊCH VỤ","","","","","","","","","","","","","","","TRẠNG THÁI","","HÓA ĐƠN LIÊN QUAN","","","",""];
        const HEADER_COLS = ["Loại hoá đơn","Ký hiệu mẫu số","Số hóa đơn","Ký hiệu","Ngày hóa đơn","Ngày ký hóa đơn",
            "Tên đơn vị bán","Mã số thuế bên bán","Địa chỉ bên bán",
            "Tên đơn vị mua","Mã số thuế mua","Địa chỉ mua","Tên người mua",
            "Tính chất","Tên hàng hóa/dịch vụ","Mã SP","ĐVT","Số lượng","Đơn giá","Chiết khấu",
            "Giá trị chưa thuế","Thuế suất","Tiền thuế","Tổng giảm trừ ko chịu thuế",
            "Tổng tiền phí","Tổng CKTM","Tổng giảm trừ khác","Giá trị thanh toán",
            "Trạng thái HD","Kết quả kiểm tra",
            "Loại liên quan","Số HĐ liên quan","Ký hiệu HĐ liên quan","Ngày HĐ liên quan","Ghi chú liên quan"];
        const WIDTHS = [27.8,17.8,12.8,12.8,12.8,18.8,42.8,21.8,45.8,34.8,17.8,45.8,23.8,21.8,41.8,12.8,12.8,12.8,12.8,12.8,
            20.8,12.8,12.8,29.8,16.8,12.8,21.8,21.8,16.8,19.8,20.8,18.8,23.8,20.8,20.8];

        const invoiceCols = (inv) => [
            inv.invoiceType, txt(inv.templateCode), inv.number, inv.series, inv.date, inv.signDate,
            inv.sellerName, inv.sellerTax, txt(inv.sellerAddr),
            txt(inv.buyerName), txt(inv.buyerTax), txt(inv.buyerAddr), txt(inv.buyerContact)
        ];
        const tailCols = (inv) => [
            inv.status, inv.checkResult,
            txt(inv.relType), txt(inv.relNumber), txt(inv.relSeries), txt(inv.relDate), txt(inv.relNote)
        ];

        const buildRows = (list) => {
            const rows = [];
            list.forEach(inv => {
                if (inv.items && inv.items.length > 0) {
                    inv.items.forEach(item => {
                        const amount = num(item.amount);
                        const vatAmt = num(item.vatAmt);
                        rows.push([
                            ...invoiceCols(inv),
                            item.tc || "1", item.name, txt(item.code), txt(item.unit),
                            num(item.qty), num(item.price), num(item.discount) ?? 0,
                            amount, txt(item.vat), vatAmt ?? 0,
                            null, null, null, null,
                            (amount || 0) + (vatAmt || 0),
                            ...tailCols(inv)
                        ]);
                    });
                } else {
                    rows.push([
                        ...invoiceCols(inv),
                        "1", null, null, null, null, null, 0,
                        num(inv.totalBeforeTax), null, num(inv.vatAmount),
                        null, null, null, null,
                        num(inv.totalAmount),
                        ...tailCols(inv)
                    ]);
                }
            });
            return rows;
        };

        const makeSheet = (rows) => {
            const aoa = [[rangeText], [], HEADER_GROUP, HEADER_COLS, ...rows];
            const ws = XLSX.utils.aoa_to_sheet(aoa);
            ws['!merges'] = [
                { s: { r: 2, c: 0 },  e: { r: 2, c: 5 } },   // A3:F3   THÔNG TIN HÓA ĐƠN
                { s: { r: 2, c: 6 },  e: { r: 2, c: 8 } },   // G3:I3   THÔNG TIN BÊN BÁN
                { s: { r: 2, c: 9 },  e: { r: 2, c: 12 } },  // J3:M3   THÔNG TIN BÊN MUA
                { s: { r: 2, c: 13 }, e: { r: 2, c: 27 } },  // N3:AB3  HÀNG HÓA / DỊCH VỤ
                { s: { r: 2, c: 28 }, e: { r: 2, c: 29 } },  // AC3:AD3 TRẠNG THÁI
                { s: { r: 2, c: 30 }, e: { r: 2, c: 34 } }   // AE3:AI3 HÓA ĐƠN LIÊN QUAN
            ];
            ws['!cols'] = WIDTHS.map(w => ({ wch: w }));
            return ws;
        };

        const normal = currentList.filter(i => !i.relType);
        const related = currentList.filter(i => i.relType);

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, makeSheet(buildRows(normal)), "Báo cáo hóa đơn");
        XLSX.utils.book_append_sheet(wb, makeSheet(buildRows(related)), "Hóa đơn thay thế-điều chỉnh");

        const today = new Date().toISOString().split('T')[0];
        XLSX.writeFile(wb, `Hoa_don_audit_all_in_one_${today}.xlsx`);
    }
</script>
