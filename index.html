<script>

/* ============================================================
   CẤU HÌNH GITHUB
============================================================ */

const pathSegments =
    window.location.pathname
        .split('/')
        .filter(Boolean);

const repoName =
    pathSegments.length > 0
        ? pathSegments[0]
        : '';

const ownerName =
    window.location.hostname.split('.')[0];


/* ============================================================
   BIẾN DỮ LIỆU
============================================================ */

let allInvoices = [];


/* ============================================================
   LOAD KHI MỞ TRANG
============================================================ */

window.addEventListener(
    'DOMContentLoaded',
    () => {
        loadInvoicesFromGitHub();
    }
);


/* ============================================================
   LOAD XML / ZIP TỪ GITHUB
============================================================ */

async function loadInvoicesFromGitHub() {

    setStatus(
        "info",
        "⏳ Đang quét danh sách file trong thư mục DATA..."
    );

    if (!ownerName || !repoName) {

        setStatus(
            "error",
            "⚠️ Hãy chạy trang web trên đường dẫn GitHub Pages."
        );

        return;
    }

    const apiUrl =
        `https://api.github.com/repos/${ownerName}/${repoName}/contents/DATA`;

    try {

        const res =
            await fetch(apiUrl);

        if (!res.ok) {

            if (res.status === 404) {

                setStatus(
                    "error",
                    "⚠️ Chưa thấy thư mục DATA. Hãy tạo thư mục DATA trên GitHub và chép file XML/ZIP vào."
                );

            } else {

                setStatus(
                    "error",
                    `❌ Lỗi lấy dữ liệu (${res.status}).`
                );

            }

            renderTable([]);

            return;
        }


        const files =
            await res.json();


        const xmlOrZipFiles =
            files.filter(
                f =>
                    f.name.toLowerCase().endsWith('.xml') ||
                    f.name.toLowerCase().endsWith('.zip')
            );


        if (xmlOrZipFiles.length === 0) {

            setStatus(
                "info",
                "📁 Thư mục DATA hiện chưa có file hóa đơn XML/ZIP nào."
            );

            renderTable([]);

            return;
        }


        allInvoices = [];


        await Promise.all(

            xmlOrZipFiles.map(

                async file => {

                    try {

                        /* ==========================
                           FILE XML
                        ========================== */

                        if (
                            file.name
                                .toLowerCase()
                                .endsWith('.xml')
                        ) {

                            const contentRes =
                                await fetch(file.download_url);

                            const text =
                                await contentRes.text();

                            parseAndAddXml(
                                text,
                                file.name,
                                text
                            );

                        }


                        /* ==========================
                           FILE ZIP
                        ========================== */

                        else if (
                            file.name
                                .toLowerCase()
                                .endsWith('.zip')
                        ) {

                            const contentRes =
                                await fetch(file.download_url);

                            const blob =
                                await contentRes.blob();

                            const zip =
                                await JSZip.loadAsync(blob);


                            for (
                                let relativePath in zip.files
                            ) {

                                if (
                                    relativePath
                                        .toLowerCase()
                                        .endsWith('.xml')
                                ) {

                                    const xmlText =
                                        await zip
                                            .files[relativePath]
                                            .async('string');

                                    parseAndAddXml(
                                        xmlText,
                                        file.name,
                                        xmlText
                                    );
                                }
                            }
                        }

                    }
                    catch (e) {

                        console.error(
                            "Lỗi đọc file:",
                            file.name,
                            e
                        );

                    }

                }

            )

        );


        allInvoices.sort(
            (a,b) =>
                new Date(b.date) -
                new Date(a.date)
        );


        setStatus(
            "success",
            `✅ Đã tải thành công ${allInvoices.length} hóa đơn từ thư mục DATA!`
        );


        renderTable(allInvoices);

    }
    catch (err) {

        setStatus(
            "error",
            "❌ Lỗi kết nối: " + err.message
        );

    }
}


/* ============================================================
   HÀM LẤY TEXT XML
============================================================ */

function getXmlText(xml, selectors) {

    if (!Array.isArray(selectors)) {

        selectors = [selectors];

    }

    for (const selector of selectors) {

        try {

            const el =
                xml.querySelector(selector);

            if (el && el.textContent) {

                return el.textContent.trim();

            }

        }
        catch (e) {}

    }

    return "";
}


/* ============================================================
   CHUYỂN SỐ
============================================================ */

function toNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;
    }


    let str =
        String(value)
            .trim()
            .replace(/\s/g, "");


    /*
       XML thường dùng:
       156000
       156000.00
       156.000
    */


    if (
        str.includes('.') &&
        str.includes(',')
    ) {

        str =
            str
                .replace(/\./g, '')
                .replace(',', '.');

    }
    else if (
        str.includes(',') &&
        !str.includes('.')
    ) {

        /*
           Nếu có dấu phẩy thập phân
        */

        str =
            str.replace(',', '.');

    }


    const n =
        Number(str);


    return isNaN(n) ? 0 : n;
}


/* ============================================================
   ĐỊNH DẠNG NGÀY
============================================================ */

function normalizeDate(value) {

    if (!value) return "";


    const s =
        String(value).trim();


    /*
       2026-08-25
       2026-08-25T10:20:00
    */

    const m =
        s.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (m) {

        return `${m[3]}/${m[2]}/${m[1]}`;

    }


    /*
       Nếu đã là dd/mm/yyyy
    */

    return s;
}


/* ============================================================
   TÁCH NGÀY ĐỂ SORT
============================================================ */

function dateForSort(value) {

    if (!value) return "";

    const s =
        String(value).trim();


    const m =
        s.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (m) {

        return `${m[1]}-${m[2]}-${m[3]}`;

    }


    return s;
}


/* ============================================================
   XÁC ĐỊNH LOẠI HÓA ĐƠN
============================================================ */

function detectInvoiceType(xml) {

    const value =
        getXmlText(
            xml,
            [
                "LoaiHDon",
                "LoaiHD",
                "LoaiHoaDon",
                "InvoiceType",
                "HinhThucHoaDon"
            ]
        );


    const lower =
        value.toLowerCase();


    if (
        lower.includes("điều chỉnh") ||
        lower.includes("dieu chinh")
    ) {

        return "HÓA ĐƠN ĐIỀU CHỈNH";
    }


    if (
        lower.includes("thay thế") ||
        lower.includes("thay the")
    ) {

        return "HÓA ĐƠN THAY THẾ";
    }


    /*
       Nếu XML không có loại:
       mặc định hóa đơn GTGT
    */

    return "HÓA ĐƠN GIÁ TRỊ GIA TĂNG";
}


/* ============================================================
   LẤY THÔNG TIN LIÊN QUAN
============================================================ */

function getRelatedInvoice(xml) {

    const number =
        getXmlText(
            xml,
            [
                "SHDCLQuan",
                "SHDThayThe",
                "SHDThayThe",
                "SoHDLienQuan",
                "SoHoaDonLienQuan",
                "InvoiceNumberRelated",
                "SoHDonLienQuan"
            ]
        );


    const series =
        getXmlText(
            xml,
            [
                "KHMSHDCLQuan",
                "KHHDCLQuan",
                "KHHDonLienQuan",
                "KyHieuHDLienQuan",
                "InvoiceSeriesRelated"
            ]
        );


    const date =
        getXmlText(
            xml,
            [
                "NLapHDCLQuan",
                "NgayHDonLienQuan",
                "NgayHoaDonLienQuan",
                "InvoiceDateRelated"
            ]
        );


    const type =
        getXmlText(
            xml,
            [
                "LoaiHDCLQuan",
                "LoaiLienQuan",
                "LoaiHoaDonLienQuan",
                "RelatedType"
            ]
        );


    const note =
        getXmlText(
            xml,
            [
                "GChuLienQuan",
                "GhiChuLienQuan",
                "RelatedNote"
            ]
        );


    return {

        type: type,

        number: number,

        series: series,

        date: normalizeDate(date),

        note: note

    };
}


/* ============================================================
   PARSE XML
============================================================ */

function parseAndAddXml(
    xmlText,
    fileName,
    rawContent
) {

    try {

        const xml =
            new DOMParser()
                .parseFromString(
                    xmlText,
                    "text/xml"
                );


        /* ==========================
           THÔNG TIN HÓA ĐƠN
        ========================== */

        const dateRaw =
            getXmlText(
                xml,
                [
                    "NLap",
                    "NGAY",
                    "InvoiceDate"
                ]
            );


        const date =
            normalizeDate(dateRaw);


        const series =
            getXmlText(
                xml,
                [
                    "KHHDon",
                    "KH",
                    "InvoiceSeries"
                ]
            );


        const number =
            getXmlText(
                xml,
                [
                    "SHDon",
                    "SOHDON",
                    "InvoiceNumber"
                ]
            );


        if (!number) {

            return;
        }


        /* ==========================
           MST BÁN
        ========================== */

        const sellerTax =
            getXmlText(
                xml,
                [
                    "NBan > MST",
                    "MSTNBan",
                    "SellerTaxCode"
                ]
            );


        /* ==========================
           BÊN BÁN
        ========================== */

        const sellerName =
            getXmlText(
                xml,
                [
                    "NBan > Ten",
                    "NBan > DVTen",
                    "Ten",
                    "SellerName"
                ]
            ) ||
            "Chưa rõ tên";


        const sellerAddr =
            getXmlText(
                xml,
                [
                    "NBan > DChi",
                    "SellerAddress"
                ]
            );


        /* ==========================
           BÊN MUA
        ========================== */

        const buyerName =
            getXmlText(
                xml,
                [
                    "NMua > Ten",
                    "NMua > DVTen",
                    "BuyerName"
                ]
            );


        const buyerTax =
            getXmlText(
                xml,
                [
                    "NMua > MST",
                    "MSTNMua",
                    "BuyerTaxCode"
                ]
            );


        const buyerAddr =
            getXmlText(
                xml,
                [
                    "NMua > DChi",
                    "BuyerAddress"
                ]
            );


        const buyerPerson =
            getXmlText(
                xml,
                [
                    "NMua > HTNguoiMua",
                    "NMua > NguoiMua",
                    "NguoiMua",
                    "BuyerNamePerson"
                ]
            );


        /* ==========================
           TỔNG TIỀN
        ========================== */

        const totalBeforeTax =
            toNumber(
                getXmlText(
                    xml,
                    [
                        "TgTCThue",
                        "TgTien",
                        "TotalBeforeTax"
                    ]
                )
            );


        const vatAmount =
            toNumber(
                getXmlText(
                    xml,
                    [
                        "TgTThue",
                        "TgThue",
                        "VATAmount"
                    ]
                )
            );


        const totalAmount =
            toNumber(
                getXmlText(
                    xml,
                    [
                        "TgTTTBSo",
                        "TgTTien",
                        "TONGTIEN",
                        "TotalAmount"
                    ]
                )
            );


        const totalText =
            getXmlText(
                xml,
                [
                    "TgTTTBChu",
                    "TotalAmountInWords"
                ]
            );


        /* ==========================
           TRẠNG THÁI
        ========================== */

        const status =
            getXmlText(
                xml,
                [
                    "TrangThai",
                    "TrangThaiHD",
                    "InvoiceStatus"
                ]
            ) ||
            "Hóa đơn mới";


        const checkResult =
            getXmlText(
                xml,
                [
                    "KetQuaKiemTra",
                    "KQKTra",
                    "CheckResult"
                ]
            ) ||
            "Đã cấp mã hóa đơn";


        /* ==========================
           LOẠI HÓA ĐƠN
        ========================== */

        const invoiceType =
            detectInvoiceType(xml);


        /* ==========================
           LIÊN QUAN
        ========================== */

        const related =
            getRelatedInvoice(xml);


        /* ==========================
           ITEM
        ========================== */

        const items = [];


        const itemNodes =
            xml.querySelectorAll(
                "HHDVu, HHDang, HHDVu"
            );


        itemNodes.forEach(
            node => {

                const name =
                    node.querySelector(
                        "THHDVu, TTen, Ten"
                    )?.textContent
                    ?.trim() || "";


                const code =
                    node.querySelector(
                        "MHHDVu, MHHDVu, MaSP, MaHang"
                    )?.textContent
                    ?.trim() || "";


                const unit =
                    node.querySelector(
                        "DVTinh, DVT"
                    )?.textContent
                    ?.trim() || "";


                const qty =
                    toNumber(
                        node.querySelector(
                            "SLuong, SL"
                        )?.textContent
                    );


                const price =
                    toNumber(
                        node.querySelector(
                            "DGia, DG"
                        )?.textContent
                    );


                const amount =
                    toNumber(
                        node.querySelector(
                            "ThTien, TT"
                        )?.textContent
                    );


                const discount =
                    toNumber(
                        node.querySelector(
                            "STCKhau, TCKH"
                        )?.textContent
                    );


                const vat =
                    node.querySelector(
                        "TSuat"
                    )?.textContent
                    ?.trim() || "";


                if (name) {

                    items.push({

                        name,

                        code,

                        unit,

                        qty,

                        price,

                        amount,

                        discount,

                        vat

                    });

                }

            }
        );


        /* ==========================
           THÊM VÀO DATA
        ========================== */

        allInvoices.push({

            fileName,

            rawContent,

            date,

            dateRaw,

            series,

            number,

            sellerTax,

            sellerName,

            sellerAddr,

            buyerName,

            buyerTax,

            buyerAddr,

            buyerPerson,

            totalBeforeTax,

            vatAmount,

            totalAmount,

            totalText,

            status,

            checkResult,

            invoiceType,

            related,

            items

        });

    }
    catch (e) {

        console.error(
            "Không đọc được XML:",
            fileName,
            e
        );

    }
}


/* ============================================================
   HIỂN THỊ TABLE
============================================================ */

function renderTable(list) {

    const tbody =
        document.getElementById(
            "invoiceList"
        );


    tbody.innerHTML = "";


    if (!list.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7"
                    class="text-center"
                    style="color:#999;padding:30px">
                    Chưa có dữ liệu hóa đơn.
                </td>
            </tr>
        `;

        return;
    }


    const fmt =
        v =>
            Number(v || 0)
                .toLocaleString("vi-VN");


    list.forEach(
        (inv, i) => {

            tbody.innerHTML += `

                <tr>

                    <td class="text-center">
                        ${i + 1}

/* ============================================================
   DOWNLOAD XML
============================================================ */

function downloadXml(index) {

    const inv =
        allInvoices[index];


    const blob =
        new Blob(
            [inv.rawContent],
            {
                type: "text/xml;charset=utf-8"
            }
        );


    const a =
        document.createElement("a");


    a.href =
        URL.createObjectURL(blob);


    a.download =
        `${inv.sellerTax}_${inv.number}.xml`;


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    setTimeout(
        () => URL.revokeObjectURL(a.href),
        1000
    );
}

/* ============================================================
   LẤY KÝ HIỆU MẪU SỐ
============================================================ */

function getInvoiceTemplateNumber(inv) {

    /*
       Một số XML có mẫu số riêng.
       Hiện tại dữ liệu parse chưa lưu trường này,
       nên thử đọc lại trực tiếp từ raw XML.
    */

    try {

        const xml =
            new DOMParser()
                .parseFromString(
                    inv.rawContent,
                    "text/xml"
                );


        const value =
            getXmlText(
                xml,
                [
                    "KHMSHDon",
                    "KHMSHD",
                    "KyHieuMauSo",
                    "MauSo",
                    "InvoiceTemplateNumber"
                ]
            );


        if (value) {

            return String(value);

        }

    }
    catch (e) {}


    /*
       Nếu không tìm thấy,
       dùng 1 giống file mẫu.
    */

    return "1";
}

function styleCell(

        };

    }


    ws[address].s = style;
}


/* ============================================================
   FORMAT SHEET
============================================================ */

function formatInvoiceSheet(ws) {

    /*
       SheetJS community bản thường không giữ
       đầy đủ style như ExcelJS.

       Tuy nhiên vẫn đặt style nếu phiên bản
       đang sử dụng hỗ trợ.
    */


    const headerGroupStyle = {

        font: {
            bold: true,
            color: {
                rgb: "FFFFFF"
            }
        },

        fill: {
            fgColor: {
                rgb: "4472C4"
            }
        },

        alignment: {
            horizontal: "center",
            vertical: "center",
            wrapText: true
        },

        border: {

            top: {
                style: "thin",
                color: {
                    rgb: "000000"
                }
            },

            bottom: {
                style: "thin",
                color: {
                    rgb: "000000"
                }
            },

            left: {
                style: "thin",
                color: {
                    rgb: "000000"
                }
            },

            right: {
                style: "thin",
                color: {
                    rgb: "000000"
                }
            }

        }

    };


    const headerStyle = {

        font: {
            bold: true,
            color: {
                rgb: "000000"
            }
        },

        fill: {
            fgColor: {
                rgb: "D9EAF7"
            }
        },

        alignment: {
            horizontal: "center",
            vertical: "center",
            wrapText: true
        },

        border: {

            top: {
                style: "thin",
                color: {
                    rgb: "808080"
                }
            },

            bottom: {
                style: "thin",
                color: {
                    rgb: "808080"
                }
            },

            left: {
                style: "thin",
                color: {
                    rgb: "808080"
                }
            },

            right: {
                style: "thin",
                color: {
                    rgb: "808080"
                }
            }

        }

    };


    const titleStyle = {

        font: {
            bold: true,
            sz: 14
        },

        alignment: {
            horizontal: "left",
            vertical: "center"
        }

    };


    /*
       A1
    */

    styleCell(
        ws,
        "A1",
        titleStyle
    );


    /*
       Group header A3:AI3
    */

    for (
        let c = 0;
        c < 35;
        c++
    ) {

        const address =
            XLSX.utils.encode_cell({
                r: 2,
                c: c
            });


        styleCell(
            ws,
            address,
            headerGroupStyle
        );

    }


    /*
       Header A4:AI4
    */

    for (
        let c = 0;
        c < 35;
        c++
    ) {

        const address =
            XLSX.utils.encode_cell({
                r: 3,
                c: c
            });


        styleCell(
            ws,
            address,
            headerStyle
        );

    }


    /*
       Format số tiền
       Số lượng
       Đơn giá
    */

    for (
        let r = 4;
        r <= 10000;
        r++
    ) {

        /*
           R = số lượng
           index 17
        */

        let cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 17
                })
            ];

        if (cell) {

            cell.z =
                '#,##0.########';

        }


        /*
           S = đơn giá
           index 18
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 18
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }


        /*
           T = chiết khấu
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 19
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }


        /*
           U = giá trị chưa thuế
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 20
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }


        /*
           W = tiền thuế
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 22
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }


        /*
           X = giảm trừ
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 23
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }


        /*
           Y = tổng tiền phí
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 24
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }


        /*
           Z = tổng CKTM
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 25
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }


        /*
           AA = giảm trừ khác
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 26
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }


        /*
           AB = giá trị thanh toán
        */

        cell =
            ws[
                XLSX.utils.encode_cell({
                    r,
                    c: 27
                })
            ];

        if (cell) {

            cell.z =
                '#,##0';

        }

    }
}


/* ============================================================
   LẤY KHOẢNG NGÀY
============================================================ */

function getDateRange(invoices) {

    if (
        !invoices ||
        invoices.length === 0
    ) {

        return {
            from: "...",
            to: "..."
        };

    }


    const dates =
        invoices
            .map(
                x =>
                    x.dateRaw ||
                    x.date
            )
            .filter(Boolean)
            .map(
                x =>
                    new Date(
                        String(x)
                            .substring(0,10)
                    )
            )
            .filter(
                x =>
                    !isNaN(x.getTime())
            );


    if (!dates.length) {

        return {
            from: "...",
            to: "..."
        };

    }


    dates.sort(
        (a,b) =>
            a - b
    );


    return {

        from:
            formatDateObject(
                dates[0]
            ),

        to:
            formatDateObject(
                dates[dates.length - 1]
            )

    };
}


/* ============================================================
   FORMAT DATE OBJECT
============================================================ */

function formatDateObject(date) {

    if (!date) return "...";


    const d =
        String(
            date.getDate()
        ).padStart(2, "0");


    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const y =
        date.getFullYear();


    return `${d}/${m}/${y}`;
}


/* ============================================================
   XUẤT EXCEL
============================================================ */

function exportToExcel() {

    if (
        !allInvoices ||
        allInvoices.length === 0
    ) {

        alert(
            "Chưa có dữ liệu hóa đơn để xuất Excel!"
        );

        return;
    }


    try {

        setStatus(
            "info",
            "⏳ Đang tạo file Excel theo form mẫu..."
        );


        /*
           Khoảng ngày
        */

        const dateRange =
            getDateRange(
                allInvoices
            );


        /*
           Phân loại
        */

        const normalInvoices =
            allInvoices.filter(
                inv => {

                    const text =
                        (
                            inv.invoiceType ||
                            ""
                        ).toLowerCase();


                    return !(
                        text.includes("thay thế") ||
                        text.includes("thay the") ||
                        text.includes("điều chỉnh") ||
                        text.includes("dieu chinh")
                    );

                }
            );


        const relatedInvoices =
            allInvoices.filter(
                inv => {

                    const text =
                        (
                            inv.invoiceType ||
                            ""
                        ).toLowerCase();


                    return (
                        text.includes("thay thế") ||
                        text.includes("thay the") ||
                        text.includes("điều chỉnh") ||
                        text.includes("dieu chinh") ||

                        (
                            inv.related &&
                            (
                                inv.related.number ||
                                inv.related.series
                            )
                        );

                }
            );


        /*
           Workbook
        */

        const workbook =
            XLSX.utils.book_new();


        /*
           SHEET 1
        */

        const ws1 =
            createInvoiceSheet(
                normalInvoices,
                dateRange.from,
                dateRange.to
            );


        formatInvoiceSheet(ws1);


        XLSX.utils.book_append_sheet(
            workbook,
            ws1,
            "Báo cáo hóa đơn"
        );


        /*
           SHEET 2
        */

        const ws2 =
            createInvoiceSheet(
                relatedInvoices,
                dateRange.from,
                dateRange.to
            );


        formatInvoiceSheet(ws2);


        XLSX.utils.book_append_sheet(
            workbook,
            ws2,
            "Hóa đơn thay thế-điều chỉnh"
        );


        /*
           TÊN FILE
        */

        const now =
            new Date();


        const dateFile =
            `${now.getFullYear()}-` +
            `${String(
                now.getMonth() + 1
            ).padStart(2,"0")}-` +
            `${String(
                now.getDate()
            ).padStart(2,"0")}`;


        const fileName =
            `Hoa_don_audit_all_in_one_${dateFile}.xlsx`;


        /*
           EXPORT
        */

        XLSX.writeFile(
            workbook,
            fileName,
            {
                bookType: "xlsx",
                compression: true
            }
        );


        setStatus(
            "success",
            `✅ Đã xuất Excel thành công: ${fileName}`
        );


    }
    catch (error) {

        console.error(
            "Lỗi xuất Excel:",
            error
        );


        setStatus(
            "error",
            "❌ Không thể xuất Excel: " +
            error.message
        );


        alert(
            "Không thể xuất Excel.\n\n" +
            error.message
        );

    }
}
