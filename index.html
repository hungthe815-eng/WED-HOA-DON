<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Bóc Tách Hóa Đơn XML/ZIP All-In-One (Fixed Full)</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px; line-height: 1.6; max-width: 850px; margin: 0 auto; background-color: #f4f6f9; color: #333; }
        .box { border: 2px dashed #007bff; padding: 30px; text-align: center; background: #ffffff; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        button { background: #28a745; color: white; border: none; padding: 14px 28px; font-size: 16px; cursor: pointer; border-radius: 6px; margin-top: 15px; font-weight: bold; }
        button:hover { background: #218838; }
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 12px 24px; cursor: pointer; background: #007bff; color: white; border-radius: 6px; font-weight: bold; }
        .custom-file-upload:hover { background: #0056b3; }
        #status { font-weight: bold; margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; }
        .status-info { background: #e7f3fe; color: #0c5460; border: 1px solid #bee5eb; display: block !important; }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block !important; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block !important; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        .guide { background: #fff8dc; border: 1px solid #ffe4b5; padding: 12px; border-radius: 6px; font-size: 13px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>

    <h2>Tool Bóc Tách Hóa Đơn XML/ZIP All-in-One (Đã Fix wsData & HVTNMHang)</h2>

    <div class="box">
        <p>Chọn <b>Thư mục chứa hóa đơn (XML / ZIP)</b>:</p>
        <label for="folderInput" class="custom-file-upload">📁 Chọn Thư Mục Hóa Đơn</label>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
        <p id="fileCount" style="color: #6c757d; font-size: 14px; margin-top: 10px;"></p>
        <button onclick="masterProcess()">Xử Lý & Xuất Excel Chuẩn Thuế</button>
        <div class="guide">
            <b>Mẹo offline 100%:</b> Nếu máy nội bộ không có mạng, tải <code>jszip.min.js</code> và <code>xlsx.full.min.js</code> bỏ chung folder với file này và sửa 2 thẻ script bên dưới thành <code>./jszip.min.js</code> và <code>./xlsx.full.min.js</code>.
        </div>
    </div>

    <p id="status"></p>

    <!-- Thư viện CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        if (typeof JSZip === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"><\/script>');
        }
        if (typeof XLSX === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
        }
    </script>

    <script>
        const folderInput = document.getElementById('folderInput');
        const fileCount = document.getElementById('fileCount');
        const statusEl = document.getElementById('status');

        function setStatus(msg, type = 'info') {
            statusEl.innerText = msg;
            statusEl.className = `status-${type}`;
        }

        folderInput.addEventListener('change', function() {
            let files = Array.from(folderInput.files).filter(f => {
                let name = f.name.toLowerCase();
                return name.endsWith('.xml') || name.endsWith('.zip');
            });
            fileCount.innerText = `Đã tìm thấy ${files.length} file XML/ZIP hợp lệ trong thư mục.`;
        });

        async function masterProcess() {
            if (typeof JSZip === 'undefined' || typeof XLSX === 'undefined') {
                setStatus('❌ Không tìm thấy thư viện xử lý ZIP/Excel. Vui lòng kiểm tra lại mạng hoặc đặt jszip/xlsx cùng thư mục.', 'error');
                return;
            }

            const rawFiles = Array.from(folderInput.files);
            const files = rawFiles.filter(f => {
                let name = f.name.toLowerCase();
                return name.endsWith('.xml') || name.endsWith('.zip');
            });

            if (files.length === 0) {
                alert('Vui lòng chọn Thư mục có chứa ít nhất 1 file XML hoặc ZIP!');
                return;
            }

            setStatus("⏳ Đang quét và bóc tách dữ liệu hóa đơn...", "info");
            let allRows = [];

            for (let file of files) {
                try {
                    let fname = file.name.toLowerCase();
                    if (fname.endsWith('.xml')) {
                        let text = await file.text();
                        parseXMLUniversal(text, allRows);
                    } else if (fname.endsWith('.zip')) {
                        let arrayBuffer = await file.arrayBuffer();
                        let zip = await JSZip.loadAsync(arrayBuffer);
                        for (let relativePath in zip.files) {
                            if (!zip.files[relativePath].dir && relativePath.toLowerCase().endsWith('.xml')) {
                                let text = await zip.files[relativePath].async('string');
                                parseXMLUniversal(text, allRows);
                            }
                        }
                    }
                } catch (e) {
                    console.warn("Bỏ qua lỗi file:", file.name, e);
                }
            }

            if (allRows.length === 0) {
                setStatus("❌ Không bóc tách được dòng hàng hóa nào từ XML!", "error");
                return;
            }

            try {
                let activeRows = [];
                let replacedRows = [];
                allRows.forEach(row => {
                    let st = String(row["Trạng thái HD"]).toLowerCase();
                    if (st.includes("thay thế") || st.includes("điều chỉnh")) {
                        replacedRows.push(row);
                    } else {
                        activeRows.push(row);
                    }
                });
                
                if (replacedRows.length === 0 && activeRows.length > 0) {
                    activeRows = allRows;
                }

                // Dùng chính hàm dựng Sheet theo đúng form mẫu
                let ws1 = buildSheetUniversal(activeRows);
                let ws2 = buildSheetUniversal(replacedRows);

                let wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws1, "Báo cáo hóa đơn");
                XLSX.utils.book_append_sheet(wb, ws2, "Hóa đơn thay thế-điều chỉnh");

                XLSX.writeFile(wb, "Hoa_don_audit_all_in_one.xlsx");
                setStatus(`✅ Xuất thành công ${allRows.length} dòng dữ liệu ra file Excel chuẩn định dạng!`, "success");
            } catch (err) {
                console.error("Lỗi xuất Excel:", err);
                setStatus("❌ Lỗi xuất file Excel: " + err.message, "error");
            }
        }

        function parseXMLUniversal(xmlString, rowsArray) {
            let parser = new DOMParser();
            let xmlDoc = parser.parseFromString(xmlString, "text/xml");

            function getNodes(parent, name) {
                if (!parent) return [];
                let res = parent.getElementsByTagName(name);
                if (res.length === 0) res = parent.getElementsByTagNameNS("*", name);
                return res;
            }

            function getVal(parent, name) {
                if (!parent) return "";
                let n = getNodes(parent, name);
                return (n.length > 0 && n[0] && n[0].textContent) ? n[0].textContent.trim() : "";
            }

            let ttChung = getNodes(xmlDoc, "TTChung")[0] || xmlDoc;
            let nBan = getNodes(xmlDoc, "NBan")[0] || xmlDoc;
            let nMua = getNodes(xmlDoc, "NMua")[0] || xmlDoc;

            let thDonVal = getVal(ttChung, "THDon");
            let loaiHD = thDonVal === "1" ? "Đầu vào" : (thDonVal || "Đầu vào");
            let khms = getVal(ttChung, "KHMSHDon");
            let shd = getVal(ttChung, "SHDon");
            let kh = getVal(ttChung, "KHHDon");
            let ngayLap = getVal(ttChung, "NLap");

            let ngayKy = "";
            let signNodes = getNodes(xmlDoc, "SigningTime");
            if (signNodes.length > 0) ngayKy = signNodes[0].textContent.trim().substring(0, 10);

            let sellerName = getVal(nBan, "Ten");
            let sellerMST = getVal(nBan, "MST");
            let sellerAddress = getVal(nBan, "DChi");

            let buyerName = getVal(nMua, "Ten");
            let buyerMST = getVal(nMua, "MST");
            let buyerAddress = getVal(nMua, "DChi");
            
            let buyerPerson = getVal(xmlDoc, "HVTNMHang") || getVal(nMua, "HVTNMHang") || getVal(nMua, "TNMua") || buyerName;

            let items = getNodes(xmlDoc, "HHDVu");
            for (let item of items) {
                let tinhChat = getVal(item, "TChat");
                let tenHang = getVal(item, "THHDVu");
                let maSP = getVal(item, "MHHDVu");
                let dvt = getVal(item, "DVTinh");
                let soLuong = parseFloat(getVal(item, "SLuong")) || 0;
                let donGia = parseFloat(getVal(item, "DGia")) || 0;
                let chietKhau = parseFloat(getVal(item, "STCKhau")) || 0;
                let tienChuaThue = parseFloat(getVal(item, "ThTien")) || 0;
                let thueSuat = getVal(item, "TSuat");
                let tienThue = parseFloat(getVal(item, "TThue")) || 0;

                if (tenHang || soLuong > 0 || tienChuaThue > 0) {
                    rowsArray.push({
                        "Loại hoá đơn": loaiHD, "Ký hiệu mẫu số": khms, "Số hóa đơn": shd, "Ký hiệu": kh,
                        "Ngày hóa đơn": ngayLap, "Ngày ký hóa đơn": ngayKy || ngayLap,
                        "Tên đơn vị bán": sellerName, "Mã số thuế bên bán": sellerMST, "Địa chỉ bên bán": sellerAddress,
                        "Tên đơn vị mua": buyerName, "Mã số thuế mua": buyerMST, "Địa chỉ mua": buyerAddress, "Tên người mua": buyerPerson,
                        "Tính chất": tinhChat, "Tên hàng hóa/dịch vụ": tenHang, "Mã SP": maSP, "ĐVT": dvt,
                        "Số lượng": soLuong, "Đơn giá": donGia, "Chiết khấu": chietKhau,
                        "Giá trị chưa thuế": tienChuaThue, "Thuế suất": thueSuat, "Tiền thuế": tienThue,
                        "Tổng giảm trừ ko chịu thuế": "", "Tổng tiền phí": "", "Tổng CKTM": "", "Tổng giảm trừ khác": "",
                        "Giá trị thanh toán": tienChuaThue + tienThue,
                        "Trạng thái HD": "Hóa đơn mới", "Kết quả kiểm tra": "Đã cấp mã hóa đơn",
                        "Loại liên quan": "", "Số HĐ liên quan": "", "Ký hiệu HĐ liên quan": "", "Ngày HĐ liên quan": "", "Ghi chú liên quan": ""
                    });
                }
            }
        }

        // Dựng Sheet Excel chính xác theo mẫu thiết kế
        function buildSheetUniversal(dataRows) {
            let wsData = [
                ["Từ ngày ... đến ..."],
                [],
                []
            ];
            wsData[2] = [];
            wsData[2][0] = "THÔNG TIN HÓA ĐƠN";
            wsData[2][6] = "THÔNG TIN BÊN BÁN";
            wsData[2][9] = "THÔNG TIN BÊN MUA";
            wsData[2][13] = "HÀNG HÓA / DỊCH VỤ";
            wsData[2][28] = "TRẠNG THÁI";
            wsData[2][30] = "HÓA ĐƠN LIÊN QUAN";

            let cols = [
                "Loại hoá đơn", "Ký hiệu mẫu số", "Số hóa đơn", "Ký hiệu", "Ngày hóa đơn", "Ngày ký hóa đơn",
                "Tên đơn vị bán", "Mã số thuế bên bán", "Địa chỉ bên bán",
                "Tên đơn vị mua", "Mã số thuế mua", "Địa chỉ mua", "Tên người mua",
                "Tính chất", "Tên hàng hóa/dịch vụ", "Mã SP", "ĐVT", "Số lượng", "Đơn giá", "Chiết khấu",
                "Giá trị chưa thuế", "Thuế suất", "Tiền thuế",
                "Tổng giảm trừ ko chịu thuế", "Tổng tiền phí", "Tổng CKTM", "Tổng giảm trừ khác", "Giá trị thanh toán",
                "Trạng thái HD", "Kết quả kiểm tra",
                "Loại liên quan", "Số HĐ liên quan", "Ký hiệu HĐ liên quan", "Ngày HĐ liên quan", "Ghi chú liên quan"
            ];
            wsData.push(cols);

            dataRows.forEach(item => {
                let r = new Array(35).fill("");
                cols.forEach((colName, idx) => { r[idx] = item[colName] !== undefined ? item[colName] : ""; });
                wsData.push(r);
            });

            let ws = XLSX.utils.aoa_to_sheet(wsData);
            let colWidths = new Array(35).fill(12);
            wsData.forEach(row => {
                if (Array.isArray(row)) {
                    row.forEach((cellVal, colIdx) => {
                        let len = cellVal ? String(cellVal).length : 10;
                        if (len > colWidths[colIdx]) colWidths[colIdx] = Math.min(len + 3, 45);
                    });
                }
            });
            ws['!cols'] = colWidths.map(w => ({ wch: w }));
            ws['!merges'] = [
                { s: { r: 2, c: 0 }, e: { r: 2, c: 5 } },
                { s: { r: 2, c: 6 }, e: { r: 2, c: 8 } },
                { s: { r: 2, c: 9 }, e: { r: 2, c: 12 } },
                { s: { r: 2, c: 13 }, e: { r: 2, c: 27 } },
                { s: { r: 2, c: 28 }, e: { r: 2, c: 29 } },
                { s: { r: 2, c: 30 }, e: { r: 2, c: 34 } }
            ];
            return ws;
        }
    </script>
</body>
</html>
