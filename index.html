<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu & Bóc Tách Hóa Đơn Nội Bộ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip để giải nén file ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- SheetJS để xuất file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-center pb-6 border-b border-gray-200 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice-dollar text-blue-600"></i>
                    Tra Cứu & Bóc Tách Hóa Đơn Nội Bộ (Galaxy Studio)
                </h1>
                <p class="text-sm text-gray-500 mt-1">Hệ thống tự động quét dữ liệu từ thư mục DATA trên GitHub Repo</p>
            </div>
            <div class="flex gap-3">
                <button onclick="loadInvoicesFromGitHub()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition shadow">
                    <i class="fa-solid fa-rotate"></i> Tải Lại Dữ Liệu
                </button>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition shadow">
                    <i class="fa-solid fa-file-excel"></i> Xuất Excel Chuẩn Thuế
                </button>
            </div>
        </div>

        <!-- THÔNG BÁO TRẠNG THÁI -->
        <div id="statusAlert" class="mt-4 p-4 rounded-lg hidden transition-all"></div>

        <!-- THANH TÌM KIẾM -->
        <div class="mt-6">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" onkeyup="filterInvoices()" placeholder="Tìm theo Mã số thuế, Tên nhà cung cấp, Số hóa đơn, Ký hiệu..." 
                       class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU HÓA ĐƠN -->
        <div class="mt-6 overflow-x-auto rounded-lg border border-gray-200">
            <table class="w-full text-sm text-left text-gray-600">
                <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b">
                    <tr>
                        <th class="px-4 py-3 text-center">STT</th>
                        <th class="px-4 py-3">Ngày Lập</th>
                        <th class="px-4 py-3">Số Hóa Đơn</th>
                        <th class="px-4 py-3">MST Bán</th>
                        <th class="px-4 py-3">Đơn Vị Bán</th>
                        <th class="px-4 py-3 text-right">Tổng Tiền (VNĐ)</th>
                        <th class="px-4 py-3 text-center">Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="invoiceTableBody">
                    <tr>
                        <td colspan="7" class="text-center py-8 text-gray-400">Đang tải dữ liệu...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL XEM CHI TIẾT HÓA ĐƠN -->
    <div id="detailModal" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white rounded-xl shadow-2xl w-11/12 max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="px-6 py-4 bg-gray-800 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg" id="modalTitle">Chi Tiết Hóa Đơn</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4" id="modalContent">
                <!-- Nội dung chi tiết hóa đơn sẽ nạp vào đây -->
            </div>
            <div class="px-6 py-3 bg-gray-100 flex justify-end">
                <button onclick="closeModal()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        // Tự động bóc tách Username và Repo Name từ URL GitHub Pages
        const pathParts = window.location.pathname.split('/').filter(p => p);
        const ownerName = window.location.hostname.split('.')[0];
        const repoName = pathParts.length > 0 ? pathParts[0] : '';

        let allInvoices = [];
        let allDetailedRows = [];

        // Hàm hiển thị thông báo trạng thái
        function setStatus(type, message) {
            const alert = document.getElementById('statusAlert');
            alert.classList.remove('hidden', 'bg-blue-100', 'text-blue-800', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (type === 'info') alert.classList.add('bg-blue-100', 'text-blue-800');
            else if (type === 'success') alert.classList.add('bg-green-100', 'text-green-800');
            else if (type === 'error') alert.classList.add('bg-red-100', 'text-red-800');

            alert.innerHTML = message;
        }

        // Tự động chạy khi tải trang
        window.onload = function() {
            loadInvoicesFromGitHub();
        };

        // QUÉT THƯ MỤC DATA TRÊN GITHUB
        async function loadInvoicesFromGitHub() {
            setStatus("info", "⏳ Đang kết nối và quét dữ liệu từ GitHub...");
            
            if (!ownerName || !repoName) {
                setStatus("error", "⚠️ Trang web cần được chạy trực tiếp trên đường dẫn <b>GitHub Pages</b>.");
                renderTable([]);
                return;
            }

            // Tìm thư mục "DATA" trước, nếu không tìm thấy sẽ thử thư mục "data"
            let apiUrl = `https://api.github.com/repos/${ownerName}/${repoName}/contents/DATA`;
            let res = await fetch(apiUrl);
            
            if (!res.ok && res.status === 404) {
                apiUrl = `https://api.github.com/repos/${ownerName}/${repoName}/contents/data`;
                res = await fetch(apiUrl);
            }

            try {
                if (!res.ok) {
                    if (res.status === 404) {
                        setStatus("error", "⚠️ Không tìm thấy thư mục <b>DATA</b> hoặc <b>data</b> trên GitHub. Vui lòng tạo thư mục và tải file XML/ZIP lên.");
                    } else {
                        setStatus("error", `❌ Lỗi kết nối GitHub API (${res.status}). Có thể bạn đã gửi quá nhiều yêu cầu, hãy đợi ít phút.`);
                    }
                    renderTable([]);
                    return;
                }

                const files = await res.json();
                
                // Lọc file không phân biệt hoa thường (.xml, .XML, .zip, .ZIP)
                const xmlOrZipFiles = files.filter(f => {
                    const name = f.name.toLowerCase();
                    return name.endsWith('.xml') || name.endsWith('.zip');
                });

                if (xmlOrZipFiles.length === 0) {
                    setStatus("error", `📁 Đã tìm thấy thư mục DATA nhưng <b>KHÔNG CÓ file XML hoặc ZIP nào</b> ở cấp gốc thư mục (Tổng số file tìm thấy: ${files.length}).`);
                    renderTable([]);
                    return;
                }

                allInvoices = [];
                allDetailedRows = [];

                // Đọc từng file
                await Promise.all(xmlOrZipFiles.map(async (file) => {
                    try {
                        const fname = file.name.toLowerCase();
                        if (fname.endsWith('.xml')) {
                            const contentRes = await fetch(file.download_url);
                            const text = await contentRes.text();
                            parseAndAddXml(text, file.name, text);
                        } else if (fname.endsWith('.zip')) {
                            const contentRes = await fetch(file.download_url);
                            const blob = await contentRes.blob();
                            const zip = await JSZip.loadAsync(blob);
                            for (let relativePath in zip.files) {
                                if (!zip.files[relativePath].dir && relativePath.toLowerCase().endsWith('.xml')) {
                                    const xmlText = await zip.files[relativePath].async('string');
                                    parseAndAddXml(xmlText, file.name, xmlText);
                                }
                            }
                        }
                    } catch (e) {
                        console.warn("Lỗi khi giải mã file:", file.name, e);
                    }
                }));

                // Sắp xếp ngày giảm dần (mới nhất lên đầu)
                allInvoices.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (allInvoices.length === 0) {
                    setStatus("error", `⚠️ Đã tìm thấy ${xmlOrZipFiles.length} file nhưng không bóc tách được dữ liệu. Kiểm tra xem file XML có đúng chuẩn hóa đơn điện tử không.`);
                } else {
                    setStatus("success", `✅ Đã tải thành công <b>${allInvoices.length} hóa đơn</b> (Tổng cộng ${allDetailedRows.length} dòng hàng hóa)!`);
                }
                
                renderTable(allInvoices);
            } catch (err) {
                setStatus("error", "❌ Lỗi hệ thống: " + err.message);
            }
        }

        // BÓC TÁCH THÔNG TIN XML HÓA ĐƠN
        function parseAndAddXml(xmlString, fileName, rawXml) {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, "text/xml");

                const getVal = (tags) => {
                    for (let tag of tags) {
                        const el = xmlDoc.getElementsByTagName(tag)[0];
                        if (el && el.textContent) return el.textContent.trim();
                    }
                    return "";
                };

                const invNo = getVal(["SHDon", "InvoiceNumber", "HDongNo", "sno"]) || "N/A";
                const sellerName = getVal(["NBan_Ten", "SellerName", "TenNBan", "sname"]) || "Chưa rõ";
                const sellerTax = getVal(["NBan_MST", "SellerTaxCode", "MSTNBan", "stax"]) || "N/A";
                const invDate = getVal(["NLap", "InvoiceDate", "NgayLap", "idate"]) || "";
                const totalAmt = parseFloat(getVal(["TgTTSo", "TotalAmount", "TongTienTT", "amount"]) || "0");
                const symbol = getVal(["KHHDon", "InvoiceSymbol", "KyHieu"]) || "";

                const invId = "INV_" + Math.random().toString(36).substr(2, 9);

                const invoiceObj = {
                    id: invId,
                    fileName: fileName,
                    invNo: invNo,
                    symbol: symbol,
                    sellerName: sellerName,
                    sellerTax: sellerTax,
                    date: invDate,
                    totalAmt: totalAmt,
                    rawXml: rawXml
                };

                allInvoices.push(invoiceObj);

                // Bóc tách chi tiết từng dòng hàng hóa
                const items = xmlDoc.getElementsByTagName("HHDVu") || xmlDoc.getElementsByTagName("Item");
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    const getItemVal = (tags) => {
                        for (let tag of tags) {
                            const el = item.getElementsByTagName(tag)[0];
                            if (el && el.textContent) return el.textContent.trim();
                        }
                        return "";
                    };

                    allDetailedRows.push({
                        invNo: invNo,
                        invDate: invDate,
                        sellerTax: sellerTax,
                        sellerName: sellerName,
                        itemName: getItemVal(["THHDVu", "ItemName", "Ten"]),
                        unit: getItemVal(["DVTinh", "Unit", "DVT"]),
                        quantity: parseFloat(getItemVal(["SLuong", "Quantity", "SoLuong"]) || "0"),
                        price: parseFloat(getItemVal(["DGia", "UnitPrice", "DonGia"]) || "0"),
                        amount: parseFloat(getItemVal(["ThTien", "Amount", "ThanhTien"]) || "0"),
                        vatRate: getItemVal(["TSuat", "VATRate", "ThueSuat"])
                    });
                }
            } catch (e) {
                console.error("Lỗi cấu trúc XML:", fileName, e);
            }
        }

        // ĐỊNH DẠNG HIỂN THỊ BẢNG
        function renderTable(data) {
            const tbody = document.getElementById('invoiceTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-400">Chưa có dữ liệu hóa đơn.</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="px-4 py-3 text-center font-medium text-gray-500">${index + 1}</td>
                    <td class="px-4 py-3">${item.date}</td>
                    <td class="px-4 py-3 font-semibold text-blue-600">${item.invNo} <span class="text-xs text-gray-400">(${item.symbol})</span></td>
                    <td class="px-4 py-3">${item.sellerTax}</td>
                    <td class="px-4 py-3 font-medium text-gray-800">${item.sellerName}</td>
                    <td class="px-4 py-3 text-right font-bold text-emerald-600">${item.totalAmt.toLocaleString('vi-VN')}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="viewDetail('${item.id}')" class="text-blue-600 hover:text-blue-800 font-medium px-2 py-1 rounded bg-blue-50 hover:bg-blue-100 transition">
                            <i class="fa-solid fa-eye"></i> Xem
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // TÌM KIẾM
        function filterInvoices() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allInvoices.filter(i => 
                i.invNo.toLowerCase().includes(q) ||
                i.sellerName.toLowerCase().includes(q) ||
                i.sellerTax.toLowerCase().includes(q) ||
                i.symbol.toLowerCase().includes(q)
            );
            renderTable(filtered);
        }

        // XEM CHI TIẾT
        function viewDetail(id) {
            const inv = allInvoices.find(i => i.id === id);
            if (!inv) return;

            document.getElementById('modalTitle').innerText = `Hóa Đơn Số: ${inv.invNo} - ${inv.sellerName}`;
            
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border">
                    <div><b>Ký hiệu:</b> ${inv.symbol}</div>
                    <div><b>Ngày lập:</b> ${inv.date}</div>
                    <div><b>Mã số thuế bán:</b> ${inv.sellerTax}</div>
                    <div><b>Tên đơn vị bán:</b> ${inv.sellerName}</div>
                    <div><b>Tổng tiền thanh toán:</b> <span class="text-emerald-600 font-bold">${inv.totalAmt.toLocaleString('vi-VN')} VNĐ</span></div>
                    <div><b>File gốc:</b> ${inv.fileName}</div>
                </div>
                <div>
                    <h4 class="font-bold mb-2">Xem Mã Nguồn XML:</h4>
                    <textarea class="w-full h-48 p-3 font-mono text-xs bg-gray-900 text-green-400 rounded-lg border focus:outline-none" readonly>${inv.rawXml}</textarea>
                </div>
            `;

            const modal = document.getElementById('detailModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        // XUẤT EXCEL
        function exportToExcel() {
            if (allDetailedRows.length === 0) {
                alert("Không có dữ liệu để xuất Excel!");
                return;
            }

            const wsData = [
                ["STT", "Ngày Hóa Đơn", "Số Hóa Đơn", "MST Bán", "Tên Đơn Vị Bán", "Tên Hàng Hóa/Dịch Vụ", "Đơn Vị Tính", "Số Lượng", "Đơn Giá", "Thành Tiền", "Thế Suất VAT"],
                ...allDetailedRows.map((r, idx) => [
                    idx + 1, r.invDate, r.invNo, r.sellerTax, r.sellerName, r.itemName, r.unit, r.quantity, r.price, r.amount, r.vatRate
                ])
            ];

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Bảng Kê Hóa Đơn");
            XLSX.writeFile(wb, `Bang_Ke_Hoa_Don_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
